name: UniRadar official-source watch
on:
  schedule:
    - cron: '16 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find reviewable official-source link proposals
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const targets = [
              ['Felvi', 'https://www.felvi.hu/'],
              ['ODT doktori témakiírások', 'https://www.doktori.hu/doktori-kepzes/temakiirasok/'],
              ['ODT doktori iskolák', 'https://www.doktori.hu/doktori-kepzes/doktori-iskolak/'],
              ['IKK felnőttképzés', 'https://ikk.hu/gyujto/felnottek-kepzese']
            ];
            const {owner,repo}=context.repo;
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100});
            const relevant=/felv[eé]tel|jelentkez|k[eé]pz[eé]s|doktori|alapk[eé]pz[eé]s|mesterk[eé]pz[eé]s|feln[oő]tt|tanfolyam|202[6-9]/i;
            const cleanText=s=>s.replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
            for(const [name,url] of targets){
              const marker='<!-- uniradar-source:'+url+' -->';
              const existing=issues.find(i=>!i.pull_request&&i.body?.includes(marker));
              try{
                const response=await fetch(url,{headers:{'User-Agent':'UniRadar-Catalogue-Watch/1.0'},signal:AbortSignal.timeout(18000)});
                if(!response.ok)throw Error('HTTP '+response.status);
                if(!(response.headers.get('content-type')||'').includes('text/html'))throw Error('not HTML');
                const html=await response.text();
                if(html.length<500||html.length>10000000)throw Error('unexpected HTML length');
                const stripped=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ');
                const digest=crypto.createHash('sha256').update(stripped.replace(/\s+/g,' ')).digest('hex');
                const oldDigest=existing?.body?.match(/Digest: `([a-f0-9]{64})`/)?.[1];
                if(oldDigest===digest){core.info(name+': no content change');continue}
                const candidates=new Map();
                const links=/<a\b([^>]*?)>([\s\S]*?)<\/a>/gi;
                for(const match of stripped.matchAll(links)){
                  const attr=match[1].match(/\bhref\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s>]+))/i);
                  if(!attr)continue;
                  const label=cleanText(match[2]).slice(0,170);
                  if(!label||!relevant.test(label))continue;
                  let target;
                  try{target=new URL((attr[1]||attr[2]||attr[3]).replace(/&amp;/g,'&'),url)}catch{continue}
                  const origin=new URL(url);
                  if(target.protocol!=='https:'||target.hostname!==origin.hostname||target.username||target.password)continue;
                  target.hash='';
                  if(candidates.size<15&&!candidates.has(target.href))candidates.set(target.href,label);
                }
                const initial=!oldDigest;
                const lines=[
                  marker,
                  'Hivatalos kiindulóoldal: '+url,
                  'Digest: `'+digest+'`',
                  'Ellenőrzés: '+new Date().toISOString(),
                  '',
                  initial?'Első forráspillanatkép. Nem bizonyít új képzést.':'Forrásoldal változott. A változás nem feltétlenül jelent új meghirdetést.',
                  '',
                  '### Ellenőrizendő hivatkozás-javaslatok',
                  'Az alábbiak az oldalról automatikusan kinyert linkek, NEM igazolt képzések vagy felvételi adatok.',
                  ...(candidates.size?[...candidates].map(([href,title])=>'- '+title+' — '+href):['- Nem található megbízhatóan kinyerhető link; kézi ellenőrzés szükséges.']),
                  '',
                  '### Kötelező szakmai ellenőrzés',
                  '- A meghirdetés ténylegesen az adott felvételi évre vonatkozik-e?',
                  '- Intézmény, képzés, helyszín, munkarend, felvételi év, státusz, közzétételi dátum és eredeti HTTPS-forrás egyeznek-e?',
                  '- Ha valami nem bizonyítható, a mező maradjon ellenőrizetlen; ne találjunk ki határidőt vagy jogosultságot.',
                  '- Ellenőrzött adatokból készülhet a scripts/import-offerings.mjs által elfogadott JSON, alapból csak dry-run.',
                  '- A figyelés soha nem publikál közvetlenül adatbázisba.'
                ];
                const body=lines.join('\n');
                const title='UniRadar forrásellenőrzés: '+name;
                if(existing){
                  await github.rest.issues.update({owner,repo,issue_number:existing.number,title,body,state:initial?'closed':'open'});
                }else{
                  await github.rest.issues.create({owner,repo,title,body,labels:[]});
                }
                core.info(name+': '+candidates.size+' candidate links; first snapshot '+initial);
              }catch(e){core.warning(name+': '+String(e))}
            }
