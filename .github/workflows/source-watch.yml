name: UniRadar official-source watch
on:
  schedule:
    - cron: '16 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watch official pages and open review tasks
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const targets = [
              ['Felvi', 'https://www.felvi.hu/'],
              ['ODT doktori témakiírások', 'https://www.doktori.hu/doktori-kepzes/temakiirasok/'],
              ['ODT doktori iskolák', 'https://www.doktori.hu/doktori-kepzes/doktori-iskolak/'],
              ['IKK felnőttképzés', 'https://ikk.hu/gyujto/felnottek-kepzese']
            ];
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100});
            for(const [name,url] of targets) {
              const marker='<!-- uniradar-source:'+url+' -->';
              const existing=issues.find(i=>!i.pull_request && i.body?.includes(marker));
              try {
                const response=await fetch(url,{headers:{'User-Agent':'UniRadar-Catalogue-Watch/1.0'},signal:AbortSignal.timeout(18000)});
                if(!response.ok)throw Error('HTTP '+response.status);
                const type=response.headers.get('content-type')||'';
                if(!type.includes('text/html'))throw Error('unexpected content-type: '+type);
                const html=await response.text();
                if(html.length<500)throw Error('unexpectedly short response');
                // Reduce predictable request-dependent noise; hash is a change alert, not an admissions fact.
                const cleaned=html.replace(/<script\\b[^>]*>[\\s\\S]*?<\\/script>/gi,' ')
                  .replace(/<style\\b[^>]*>[\\s\\S]*?<\\/style>/gi,' ')
                  .replace(/\\s+/g,' ').trim();
                const hash=crypto.createHash('sha256').update(cleaned).digest('hex');
                const oldHash=existing?.body?.match(/Digest: \`([a-f0-9]{64})\`/)?.[1];
                if(oldHash===hash)continue;
                const first=!oldHash;
                const body=[marker,
                  'Hivatalos oldal: '+url,
                  'Digest: \`'+hash+'\`',
                  'Ellenőrizve: '+new Date().toISOString(),
                  '',
                  first?'Első rögzített pillanatkép – nem állítunk változást a felvételi kínálatban.':
                    'Az oldal tartalma eltér a legutóbb rögzített pillanatképtől. Ez még nem igazol új képzést vagy megváltozott felvételi szabályt.',
                  '',
                  '**Ellenőrzési feladat**',
                  '- Vizsgáld meg az intézményi vagy hivatalos, évhez kötött eredeti meghirdetést.',
                  '- Rögzítsd: képzés, intézmény, év, munkarend, státusz, forrás URL, forrás dátuma, határidő.',
                  '- Csak hiteles ellenőrzés után kerülhet a Neon uniradar_offerings táblába.',
                  '- A forrásfigyelő soha nem módosít adatbázist és nem ír ki automatikus felvételi jogosultságot.'
                ].join('\\n');
                if(existing){
                  await github.rest.issues.update({owner,repo,issue_number:existing.number,title:'UniRadar forrásellenőrzés: '+name,body,state:first?'closed':'open'});
                }else{
                  await github.rest.issues.create({owner,repo,title:'UniRadar forráskiindulópont: '+name,body});
                }
              } catch(err) {
                core.warning(name+' nem ellenőrizhető: '+String(err));
                // A hálózati hiba nem bizonyít változást, ezért nem készül belőle hamis riasztás.
              }
            }
